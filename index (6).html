function slc(k){if(SLC[k])return SLC[k];var o=[],d=dd(PST),e=dd(PLAN[k].end);while(d<=e){D[d.getDay()].r.forEach(function(x,q){if(x[1]==='Study'&&x[2]===k)o.push([ds(d),q])});d.setDate(d.getDate()+1)}SLC[k]=o;return o}
function chunk(k,i){var P=PLAN[k],M=P.a.length,N=slc(k).length,a=Math.floor(i*M/N),b=Math.max(a+1,Math.floor((i+1)*M/N));return(i>0&&Math.floor((i-1)*M/N)==a&&b==a+1)?'Consolidate: '+P.a[a]:P.a.slice(a,b).join(' · ')}
function topicsFor(dt,q,k){var P=PLAN[k];if(!P)return '';if(dt<PST)return 'Your reading plan starts on '+fmt(dd(PST));if(dt>P.end){var x=dd(P.end),y=dd(dt),j=0,K=Math.ceil(P.a.length/8),s0;x.setDate(x.getDate()+1);while(x<y){D[x.getDay()].r.forEach(function(r){if(r[1]==='Study'&&r[2]===k)j++});x.setDate(x.getDate()+1)}s0=(j*K)%P.a.length;return 'Revise and do past questions: '+P.a.slice(s0,s0+K).join(' · ')}var s=slc(k),i;for(i=0;i<s.length;i++){if(s[i][0]==dt&&s[i][1]==q)return chunk(k,i)}return ''}
function tpx(t,q,r){return r[1]==='Study'?'<small style="color:var(--pinkd)">📖 '+esc(topicsFor(t,q,r[2]))+'</small>':''}
function tmr(){var d=new Date();d.setDate(d.getDate()+1);var t=ds(d),h='';D[d.getDay()].r.forEach(function(r,q){if(r[1]==='Study')h+='<div class="li"><div><b>'+esc(lab(r))+'</b><small>'+r[0]+'</small><small style="color:var(--pinkd)">📖 '+esc(topicsFor(t,q,r[2]))+'</small></div></div>'});return h?'<div class="card"><h2>🌙 Tomorrow’s reading</h2>'+h+'</div>':''}
var SY='UBiology 001';
function rSy(){var k=SY,P=PLAN[k],t=ds(),s=slc(k),N=s.length,i,rows='',n=0,past=0;
for(i=0;i<N;i++){if(s[i][0]<t)past++;else if(n<12){n++;rows+='<div class="li"><div><b>'+fmt(dd(s[i][0]))+'</b><small>'+esc(chunk(k,i))+'</small></div></div>'}}
var ch=Object.keys(PLAN).map(function(x){return '<button class="btn'+(SY==x?'':' o')+'" onclick="sye(\''+x+'\')">'+PLAN[x].n+'</button>'}).join('');
var pc=N?Math.round(past*100/N):0;
$('v4').innerHTML='<div class="card"><h2>🗺️ Reading plan</h2><div class="chips">'+ch+'</div></div><div class="card"><h2>'+P.n+'</h2><p class="mut">Finish new topics by '+fmt(dd(P.end))+' · '+P.a.length+' topics in '+N+' study sessions</p><div class="bar"><i style="width:'+pc+'%"></i></div><p class="mut" style="text-align:center">'+pc+'% of the sessions are behind you</p>'+(t<PST?'<p class="mut">Your plan starts on '+fmt(dd(PST))+'.</p>':'')+(rows||'<p class="mut">All sessions done. Time for revision 🎉</p>')+'</div>'}
function sye(k){SY=k;rSy()}
var BP=[],BI=0;
function showB(i){BI=i;var d='';if(BP.length>1)for(var k=0;k<BP.length;k++)d+='<i class="'+(k==i?'on':'')+'"></i>';$('ban').innerHTML='<img src="'+BP[i]+'" alt="">'+(d?'<div class="bd">'+d+'</div>':'')}
function banner(){try{$('ban').innerHTML='<div class="bph">🌸</div>';for(var i=1;i<=12;i++){(function(k){var im=new Image();im.onload=function(){BP.push('p'+k+'.jpg');BP.sort(function(a,b){return parseInt(a.slice(1))-parseInt(b.slice(1))});showB(0)};im.src='p'+k+'.jpg'})(i)}setInterval(function(){if(BP.length>1)showB((BI+1)%BP.length)},6000)}catch(e){}}
banner();go(0);show(cur);tick();setInterval(function(){tick();show(cur)},30000);
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){})}
</script>
