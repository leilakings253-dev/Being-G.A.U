<style>
:root{--bg:#fff7ee;--card:#fffdf9;--ink:#4a3b40;--mut:#8a7780;--pink:#fbdbe4;--pinkd:#c9577a;--sea:#d3f0e8;--sead:#2f8f7c;--gold:#d4af37;--goldbg:#f8efcb;--silver:#e4e6ea;--silverd:#6b7280;--line:#ecdccb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#231b1f;--card:#2e2428;--ink:#f6e9e4;--mut:#b9a5ad;--pink:#4f2d3b;--pinkd:#f5a8c0;--sea:#1d4640;--sead:#8fe0cf;--gold:#e6c65a;--goldbg:#463c1b;--silver:#393d45;--silverd:#c9cdd4;--line:#473840}}
:root[data-theme="dark"]{--bg:#231b1f;--card:#2e2428;--ink:#f6e9e4;--mut:#b9a5ad;--pink:#4f2d3b;--pinkd:#f5a8c0;--sea:#1d4640;--sead:#8fe0cf;--gold:#e6c65a;--goldbg:#463c1b;--silver:#393d45;--silverd:#c9cdd4;--line:#473840}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Quicksand',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.45}
.wrap{max-width:640px;margin:0 auto;padding:18px 16px 40px}
header{text-align:center;padding:26px 14px 20px;border-radius:24px;background:linear-gradient(135deg,var(--pink),var(--sea));border:2px solid var(--gold)}
h1{font-family:'Playfair Display',Georgia,serif;font-size:2.3rem;margin:0;color:var(--pinkd);letter-spacing:.5px}
.sub{margin:6px 0 0;color:var(--ink);font-weight:500}
.rules{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.rules span{background:var(--card);border:1px solid var(--gold);border-radius:99px;padding:4px 12px;font-size:.78rem;color:var(--ink)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:18px 2px 8px}
.tabs button{flex:0 0 auto;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:600 .9rem 'Quicksand',system-ui,sans-serif;padding:8px 14px;border-radius:99px;cursor:pointer}
.tabs button.on{background:var(--pinkd);border-color:var(--pinkd);color:#fff}
.sum{display:flex;gap:10px;margin:10px 0 14px}
.sum div{flex:1;text-align:center;background:var(--card);border:1px solid var(--silver);border-radius:16px;padding:10px 6px}
.sum b{display:block;font-family:'Playfair Display',Georgia,serif;font-size:1.25rem;color:var(--pinkd)}
.sum small{color:var(--mut);font-size:.72rem}
.row{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--silver);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.t{font-weight:600;font-size:.82rem;color:var(--mut)}
.a{font-size:.95rem}
.a i{display:block;font-style:normal;font-size:.72rem;font-weight:600;margin-top:2px}
.row.J{border-left-color:var(--pinkd);background:var(--pink)}.J i{color:var(--pinkd)}
.row.U{border-left-color:var(--sead);background:var(--sea)}.U i{color:var(--sead)}
.row.Y{border-left-color:var(--silverd);background:var(--silver)}.Y i{color:var(--silverd)}
.row.G{border-left-color:var(--gold);background:var(--goldbg)}.G i{color:var(--gold)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;margin-top:18px;font-size:.76rem;color:var(--mut)}
.legend em{font-style:normal;display:inline-flex;align-items:center;gap:5px}
.legend s{width:11px;height:11px;border-radius:50%;display:inline-block}
.note{margin-top:18px;text-align:center;font-size:.8rem;color:var(--mut);border-top:1px dashed var(--gold);padding-top:14px}
.now{margin-top:16px;text-align:center;padding:16px;border-radius:20px;background:var(--card);border:1.5px solid var(--gold)}
.clk{font-family:'Playfair Display',Georgia,serif;font-size:2.4rem;color:var(--pinkd);line-height:1}
.gr{margin:6px 0 10px;color:var(--mut);font-size:.88rem}
.nw{font-weight:600;font-size:1.05rem}
.nx{margin-top:4px;font-size:.8rem;color:var(--mut)}
.row.now{box-shadow:0 0 0 2px var(--gold)}

.wrap{padding-bottom:100px}
.hid{display:none}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:2px solid var(--gold);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
.nav button{flex:1;border:0;background:none;color:var(--mut);font:600 .66rem 'Quicksand',system-ui,sans-serif;padding:4px 0;cursor:pointer}
.nav button span{display:block;font-size:1.35rem}
.nav button.on{color:var(--pinkd)}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:16px;margin-top:14px}
.card h2{font-family:'Playfair Display',Georgia,serif;margin:0 0 10px;font-size:1.15rem;color:var(--pinkd)}
.btn{border:0;border-radius:99px;padding:9px 16px;font:600 .86rem 'Quicksand',system-ui,sans-serif;background:var(--pinkd);color:#fff;cursor:pointer}
.btn.s{background:var(--sead);color:#fff}.btn.g{background:var(--gold);color:#4a3b40}.btn.o{background:var(--silver);color:var(--ink)}
.card input,.card textarea{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:10px;background:var(--bg);color:var(--ink);font:inherit;margin:6px 0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.dots{display:flex;gap:6px;justify-content:center;margin:12px 0 6px}
.dots b{width:32px;height:32px;border-radius:50%;background:var(--silver);display:flex;align-items:center;justify-content:center;font-size:.72rem;color:var(--silverd)}
.dots b.y{background:var(--sead);color:#fff}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:.92rem}
.li small{display:block;color:var(--mut)}
.big{text-align:center;font-family:'Playfair Display',Georgia,serif;font-size:1.6rem;color:var(--pinkd)}
.mut{color:var(--mut);font-size:.85rem}
.verse{background:linear-gradient(135deg,var(--pink),var(--sea));border-color:var(--gold);text-align:center}
.verse p{margin:0 0 6px;font-style:italic;font-size:1rem}.verse b{color:var(--pinkd);font-size:.85rem}
.bar{height:12px;border-radius:99px;background:var(--silver);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pinkd),var(--sead))}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.tile{border-radius:22px;padding:16px 6px;text-align:center;border:1.5px solid var(--gold);cursor:pointer}
.tile b{display:block;font-family:'Playfair Display',Georgia,serif;font-size:1.5rem;color:var(--pinkd)}
.tile small{font-size:.72rem;color:var(--ink)}
.t1{background:var(--pink)}.t2{background:var(--sea)}.t3{background:var(--goldbg)}
.nav button{font-size:.6rem}
</style>
</head>
<body>
<div class="wrap">
<div id="v0">
<header>
<h1>Being G.A.U</h1>
<p class="sub">Every minute counts ✨</p>
<div class="rules"><span>🌙 Sleep by 12</span><span>🙏 1h quiet time daily</span><span>📚 Max 8h study</span></div>

<div class="now"><div class="clk" id="clk"></div><div class="gr" id="gr"></div><div class="nw" id="nw"></div><div class="nx" id="nx"></div></div>
<div id="tcards"></div>
</div>
<div id="v5" class="hid">
<div class="tabs" id="tabs"></div>
<div class="sum" id="sum"></div>
<div id="list"></div>
<div class="legend">
<em><s style="background:var(--pinkd)"></s>JAMB &amp; Post-UTME</em>
<em><s style="background:var(--sead)"></s>JUPEB</em>
<em><s style="background:var(--gold)"></s>Prayer &amp; church</em>
<em><s style="background:var(--silverd)"></s>YouTube work</em>
</div>
<p class="note">JAMB and Post-UTME share the same books: English, Biology, Physics and Chemistry. JUPEB: Biology, Physics and Chemistry, each split into 001 and 002.</p>
</div>
<div id="v1" class="hid"></div><div id="v2" class="hid"></div><div id="v3" class="hid"></div><div id="v4" class="hid"></div>
</div>
<nav class="nav" id="nav"></nav>
<script>
var L={J:'JAMB & Post-UTME',U:'JUPEB'};
function wk(a,b,c){return[
['4:00–5:00','Wake, pray, quiet time, Bible','G','Quiet time'],
['5:00–5:45','Bathe, prepare, eat'],
['5:45–7:30','Study',a],
['7:30–8:00','Go to school'],
['8:00–2:00','Classes'],
['2:00–2:30','Lunch, move to work spot'],
['2:30–5:00','YouTube work with your friend','Y','2h 30m'],
['5:00–6:00','Go home'],
['6:00–7:00','Rest, cook, eat dinner'],
['7:00–9:00','Study',b],
['9:00–9:15','Break'],
['9:15–11:15','Study',c],
['11:15–12:00','Wind down, prepare tomorrow, pray, sleep by 12']]}
var D=[
{n:'Sun',s:'4h',y:'3h',r:[
['5:00–6:00','Wake, quiet time','G','Quiet time'],
['6:00–6:45','Bathe, prepare, leave for church'],
['7:00–12:00','Church','G','5h'],
['12:00–1:00','Home, cook, eat'],
['1:00–2:00','Leftover chores'],
['2:00–3:00','Sleep'],
['3:00–3:30','Get ready, walk to your friend'],
['3:30–6:30','YouTube work with your friend','Y','3h'],
['6:30–7:00','Walk back'],
['7:00–7:30','Dinner'],
['7:30–9:30','Study','UChemistry 001'],
['9:30–11:30','Study','JBiology'],
['11:30–12:00','Wind down, pray, sleep by 12']]},
{n:'Mon',s:'5h 45m',y:'2h 30m',r:wk('JEnglish','UBiology 001','UPhysics 001')},
{n:'Tue',s:'5h 45m',y:'2h 30m',r:wk('UChemistry 001','JBiology','JPhysics')},
{n:'Wed',s:'3h 45m',y:'1h 30m',r:[
['4:00–5:00','Wake, pray, quiet time, Bible','G','Quiet time'],
['5:00–5:45','Bathe, prepare, eat'],
['5:45–7:30','Study','JChemistry'],
['7:30–8:00','Go to school'],
['8:00–2:00','Classes'],
['2:00–2:30','Lunch'],
['2:30–4:00','YouTube work (shortened)','Y','1h 30m'],
['4:00–4:30','Go to church'],
['4:30–7:45','Church program','G','Closing time may vary'],
['7:45–8:30','Go home'],
['8:30–9:00','Dinner'],
['9:00–11:15','Study','UBiology 002'],
['11:15–12:00','Wind down, prepare tomorrow, pray, sleep by 12']]},
{n:'Thu',s:'5h 45m',y:'2h 30m',r:wk('UPhysics 002','UChemistry 002','JEnglish')},
{n:'Fri',s:'5h 45m',y:'2h 30m',r:wk('JBiology','JPhysics','UBiology 001')},
{n:'Sat',s:'6h',y:'3h',r:[
['4:00–5:00','Wake, pray, quiet time, Bible','G','Quiet time'],
['5:00–7:30','Chores'],
['7:30–8:30','Cook and eat'],
['8:30–9:00','Rest'],
['9:00–11:00','Study','UPhysics 002'],
['11:00–1:00','Study','JChemistry'],
['1:00–2:00','Lunch'],
['2:00–4:00','Sleep or rest'],
['4:30–5:00','Walk to your friend'],
['5:00–8:00','YouTube work with your friend','Y','3h'],
['8:00–8:30','Walk back'],
['8:30–9:00','Dinner'],
['9:00–11:00','Study','JEnglish'],
['11:00–12:00','Wind down, pray, sleep by 12']]}
];
var cur=new Date().getDay();
function show(i){
cur=i;var d=D[i];
document.getElementById('tabs').innerHTML=D.map(function(x,k){return '<button class="'+(k==i?'on':'')+'" onclick="show('+k+')">'+x.n+'</button>'}).join('');
document.getElementById('sum').innerHTML='<div><b>'+d.s+'</b><small>Study</small></div><div><b>'+d.y+'</b><small>YouTube work</small></div>';
var tm=T(d.r),nm=nowMin(),isT=(i==new Date().getDay());
document.getElementById('list').innerHTML=d.r.map(function(x,q){
var raw=x[2]||'',c=raw.charAt(0),sub=raw.slice(1),tag=x[3]||(L[c]||'');
var act=x[1]==='Study'&&sub?'Study '+sub:x[1];
return '<div class="row '+c+((isT&&nm>=tm[q][0]&&nm<tm[q][1])?' now':'')+'"><div class="t">'+x[0]+'</div><div class="a">'+act+(tag?'<i>'+(c=='J'||c=='U'?L[c]:tag)+'</i>':'')+'</div></div>'}).join('');
}
function pm(s){var p=s.split(':');return (p[0]%12)*60+ +p[1]}
function T(r){var p=-1,o=[];r.forEach(function(x){var s=x[0].split('–'),a=pm(s[0]),e=pm(s[1]);while(a<p)a+=720;while(e<=a)e+=720;o.push([a,e]);p=a});return o}
function nowMin(){var n=new Date();return n.getHours()*60+n.getMinutes()}
function lab(r){return r[1]==='Study'&&r[2]?'Study '+r[2].slice(1):r[1]}
function tick(){
var n=new Date(),h=n.getHours(),m=n.getMinutes(),dt=D[n.getDay()],tm=T(dt.r),nm=h*60+m,k,cu=-1;
document.getElementById('clk').textContent=(h%12||12)+':'+(m<10?'0':'')+m+' '+(h<12?'AM':'PM');
document.getElementById('gr').textContent=(h<12?'Good morning':h<17?'Good afternoon':'Good evening')+', Goodness 🌸 · '+['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][n.getDay()];
for(k=0;k<tm.length;k++){if(nm>=tm[k][0]&&nm<tm[k][1]){cu=k}}
var nw=document.getElementById('nw'),nx=document.getElementById('nx');
if(cu<0){nw.textContent=nm<240?'🌙 Rest well, Goodness':'Free time ✨';var nk=-1;for(k=0;k<tm.length;k++){if(tm[k][0]>nm){nk=k;break}}nx.textContent=nk<0?'':'Next at '+dt.r[nk][0].split('–')[0]+': '+lab(dt.r[nk])}
else{var r=dt.r[cu],pre=r[1]==='Study'?'📚 Time to read: ':/sleep|wind down|rest/i.test(r[1])?'🌙 Time to rest: ':'Now: ';nw.textContent=pre+lab(r);nx.textContent=dt.r[cu+1]?'Next at '+dt.r[cu+1][0].split('–')[0]+': '+lab(dt.r[cu+1]):''}
}
function icon(){try{var c=document.createElement('canvas');c.width=c.height=180;var x=c.getContext('2d'),g=x.createLinearGradient(0,0,180,180);g.addColorStop(0,'#f9c6d6');g.addColorStop(1,'#bfeadf');x.fillStyle=g;x.fillRect(0,0,180,180);x.strokeStyle='#d4af37';x.lineWidth=8;x.strokeRect(4,4,172,172);x.fillStyle='#c9577a';x.textAlign='center';x.font='bold 96px Georgia,serif';x.fillText('G',90,118);document.getElementById('ati').href=c.toDataURL('image/png')}catch(e){}}
var S={};try{S=JSON.parse(localStorage.getItem('gau'))||{}}catch(e){S={}}
function norm(){S.q=S.q||{};S.b=S.b||[];S.f=S.f||[];S.p=S.p||[];S.fl=S.fl||{};S.m=S.m||{};S.ex=S.ex||{};S.st=S.st||{};S.pr=S.pr||[];S.g=S.g||[];S.yt=S.yt||[]}norm();
function save(){try{localStorage.setItem('gau',JSON.stringify(S))}catch(e){}}
function $(i){return document.getElementById(i)}
function ds(d){d=d||new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function dd(s){var p=s.split('-');return new Date(+p[0],p[1]-1,+p[2])}
function dif(a,b){return Math.round((dd(b)-dd(a))/864e5)}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fmt(d){return d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})}
function go(i){for(var k=0;k<6;k++){$('v'+k).className=k==i?'':'hid'}
$('nav').innerHTML=[[0,'🌸','Home'],[5,'📅','Schedule'],[3,'📚','Study'],[1,'🙏','Spirit'],[4,'🎬','Create'],[2,'💗','Me']].map(function(x){return '<button class="'+(x[0]==i?'on':'')+'" onclick="go('+x[0]+')"><span>'+x[1]+'</span>'+x[2]+'</button>'}).join('');
if(i==0)rTd();if(i==1)rSp();if(i==2)rMe();if(i==3)rSt();if(i==4)rYt();if(i==5)show(cur);window.scrollTo(0,0)}
function rMe(){$('v2').innerHTML=hFr()+hCy()+hBk()}
function rSp(){var t=ds(),m=S.q[t]||0,n=new Date(),dow=(n.getDay()+6)%7,w='',i,d,st=0;
for(i=0;i<7;i++){d=new Date(n);d.setDate(n.getDate()-dow+i);w+='<b class="'+(S.q[ds(d)]?'y':'')+'">'+'MTWTFSS'.charAt(i)+'</b>'}
d=new Date();if(!S.q[ds(d)])d.setDate(d.getDate()-1);while(S.q[ds(d)]){st++;d.setDate(d.getDate()-1)}
var bl=S.b.slice(-5).reverse().map(function(x,j){var ix=S.b.length-1-j;return '<div class="li"><div><b>'+esc(x.p)+'</b><small>'+x.d+(x.n?' · '+esc(x.n):'')+'</small></div><button class="btn o" onclick="delB('+ix+')">✕</button></div>'}).join('')||'<small class="mut">No readings saved yet</small>';
var pl=S.pr.map(function(x,i){return{x:x,i:i}}).sort(function(a,b){return(a.x.a?1:0)-(b.x.a?1:0)||b.i-a.i}).slice(0,8).map(function(o){var x=o.x;return '<div class="li"><div><b>'+(x.a?'🙌 ':'')+esc(x.t)+'</b><small>'+x.d+'</small></div><div class="chips"><button class="btn'+(x.a?' s':' g')+'" onclick="ans('+o.i+')">'+(x.a?'Answered':'🙌')+'</button><button class="btn o" onclick="delPr('+o.i+')">✕</button></div></div>'}).join('')||'<small class="mut">No prayer requests yet.</small>';
var gl=S.g.slice(-5).reverse().map(function(x,j){var ix=S.g.length-1-j;return '<div class="li"><div><b>'+esc(x.t)+'</b><small>'+x.d+'</small></div><button class="btn o" onclick="delG('+ix+')">✕</button></div>'}).join('')||'<small class="mut">Nothing saved yet.</small>';
var prc='<div class="card"><h2>🕊️ Prayer list</h2><input id="pt" placeholder="A prayer request"><button class="btn s" onclick="addPr()">Add request</button><div style="margin-top:10px">'+pl+'</div><p class="mut">Tap 🙌 when God answers.</p></div>';
var grc='<div class="card"><h2>🌷 Gratitude</h2><input id="gt" placeholder="Today I am thankful for…"><button class="btn s" onclick="addG()">Save</button><div style="margin-top:10px">'+gl+'</div></div>';
$('v1').innerHTML='<div class="card"><h2>🙏 Quiet time</h2><div class="big">'+(m?m+' min today ✓':'Not yet today')+'</div><div class="dots">'+w+'</div><p class="mut" style="text-align:center">🔥 '+st+' day streak</p><div class="chips"><button class="btn" onclick="setQ(30)">30 min</button><button class="btn" onclick="setQ(60)">1 hour</button><button class="btn" onclick="setQ(90)">90 min</button><button class="btn o" onclick="setQ(0)">Clear</button></div></div><div class="card"><h2>📖 Bible reading</h2><input id="bp" placeholder="Passage, e.g. John 3"><textarea id="bn" rows="2" placeholder="What did God show you?"></textarea><button class="btn s" onclick="addB()">Save reading</button><div style="margin-top:10px">'+bl+'</div></div>'+prc+grc}
function setQ(m){if(m)S.q[ds()]=m;else delete S.q[ds()];save();rSp()}
function addB(){var p=$('bp').value.trim();if(!p)return;S.b.push({d:ds(),p:p,n:$('bn').value.trim()});save();rSp()}
function delB(i){S.b.splice(i,1);save();rSp()}
function hFr(){var t=ds(),h=S.f.map(function(x,i){var g=x.l?dif(x.l,t):-1,s=g<0?'Not checked yet':g==0?'Checked today 💗':g+' day'+(g==1?'':'s')+' ago';var nd=g<0||g>7;return '<div class="li"><div><b>'+esc(x.n)+'</b><small>'+s+(nd?' · time to reach out 💌':'')+'</small></div><div class="chips"><button class="btn g" onclick="chk('+i+')">💌</button><button class="btn o" onclick="delF('+i+')">✕</button></div></div>'}).join('')||'<small class="mut">Add the friends you want to remember to check on.</small>';
return '<div class="card"><h2>💕 Friends</h2><input id="fn" placeholder="Friend’s name"><button class="btn s" onclick="addF()">Add friend</button><div style="margin-top:10px">'+h+'</div><p class="mut">Tap 💌 after you check on someone.</p></div>'}
function chk(i){S.f[i].l=ds();save();rMe()}
function addF(){var v=$('fn').value.trim();if(v){S.f.push({n:v,l:''});save();rMe()}}
function delF(i){S.f.splice(i,1);save();rMe()}
var FL=['Spotting','Light','Medium','Heavy'];
function hCy(){var t=ds(),cf=S.fl[t],ps=S.p.slice().sort(),pr='',i;
if(ps.length){var last=ps[ps.length-1],g=[],avg=28;for(i=1;i<ps.length;i++)g.push(dif(ps[i-1],ps[i]));if(g.length){avg=Math.round(g.reduce(function(a,b){return a+b},0)/g.length);if(avg<21||avg>45)avg=28}
var nx=dd(last);nx.setDate(nx.getDate()+avg);var left=dif(t,ds(nx));
pr='<div class="big">'+fmt(nx)+'</div><p class="mut" style="text-align:center">'+(left>0?'in '+left+' day'+(left==1?'':'s'):left==0?'expected today':Math.abs(left)+' day'+(left==-1?'':'s')+' past the estimate')+' · average cycle '+avg+' days</p>'}
else pr='<p class="mut">Log the first day of your period to see an estimate.</p>';
var ch=FL.map(function(f){return '<button class="btn'+(cf==f?'':' o')+'" onclick="setF(\''+f+'\')">'+f+'</button>'}).join('');
var hs=ps.slice(-4).reverse().map(function(x){return '<div class="li"><span>'+fmt(dd(x))+'</span><button class="btn o" onclick="delP(\''+x+'\')">✕</button></div>'}).join('');
var fl=Object.keys(S.fl).sort().slice(-7).reverse().map(function(k){return '<div class="li"><span>'+fmt(dd(k))+'</span><b>'+esc(S.fl[k])+'</b></div>'}).join('');
return '<div class="card"><h2>🌙 Next period (estimate)</h2>'+pr+'</div><div class="card"><h2>💧 Today’s flow</h2><div class="chips">'+ch+'<button class="btn o" onclick="setF(\'\')">None</button></div><div style="margin-top:12px"><button class="btn" onclick="addP()">🌸 Period started today</button></div></div>'+(hs?'<div class="card"><h2>Period start dates</h2>'+hs+'</div>':'')+(fl?'<div class="card"><h2>Recent flow</h2>'+fl+'</div>':'')+'<p class="mut" style="text-align:center">Estimates only, not medical advice. See a doctor if your cycle changes a lot.</p>'}
function setF(f){if(f)S.fl[ds()]=f;else delete S.fl[ds()];save();rMe()}
function addP(){if(S.p.indexOf(ds())<0)S.p.push(ds());save();rMe()}
function delP(x){S.p=S.p.filter(function(y){return y!=x});save();rMe()}
function hBk(){return '<div class="card"><h2>💾 Backup</h2><p class="mut">Everything you log is saved only on this phone. If you clear Chrome’s data or delete the app, it is erased, so save a backup now and then.</p><button class="btn s" onclick="exp()">Save backup file</button><p class="mut" style="margin-top:14px">Restore from a backup file:</p><input type="file" id="imf" accept=".json,application/json" onchange="imp(this)"></div>'}
function exp(){try{var b=new Blob([JSON.stringify(S)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='being-gau-backup.json';document.body.appendChild(a);a.click();a.remove()}catch(e){alert('Could not save the backup')}}
function imp(el){var f=el.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{S=JSON.parse(r.result);norm();save();alert('Backup restored 🌸')}catch(e){alert('That file did not work')}};r.readAsText(f)}
function addPr(){var v=$('pt').value.trim();if(v){S.pr.push({t:v,d:ds(),a:0});save();rSp()}}
function ans(i){S.pr[i].a=S.pr[i].a?0:1;save();rSp()}
function delPr(i){S.pr.splice(i,1);save();rSp()}
function addG(){var v=$('gt').value.trim();if(v){S.g.push({t:v,d:ds()});save();rSp()}}
function delG(i){S.g.splice(i,1);save();rSp()}
var VS=[['Philippians 4:13','I can do all things through Christ which strengtheneth me.'],['Proverbs 3:5','Trust in the LORD with all thine heart; and lean not unto thine own understanding.'],['Psalm 119:105','Thy word is a lamp unto my feet, and a light unto my path.'],['Joshua 1:9','Be strong and of a good courage; be not afraid, neither be thou dismayed: for the LORD thy God is with thee whithersoever thou goest.'],['Proverbs 16:3','Commit thy works unto the LORD, and thy thoughts shall be established.'],['Matthew 6:33','But seek ye first the kingdom of God, and his righteousness; and all these things shall be added unto you.'],['Colossians 3:23','And whatsoever ye do, do it heartily, as to the Lord, and not unto men.'],['Psalm 37:5','Commit thy way unto the LORD; trust also in him; and he shall bring it to pass.'],['James 1:5','If any of you lack wisdom, let him ask of God, that giveth to all men liberally, and upbraideth not; and it shall be given him.'],['Galatians 6:9','And let us not be weary in well doing: for in due season we shall reap, if we faint not.'],['Philippians 4:6','Be careful for nothing; but in every thing by prayer and supplication with thanksgiving let your requests be made known unto God.'],['2 Timothy 1:7','For God hath not given us the spirit of fear; but of power, and of love, and of a sound mind.'],['Psalm 23:1','The LORD is my shepherd; I shall not want.'],['Proverbs 4:7','Wisdom is the principal thing; therefore get wisdom: and with all thy getting get understanding.']];
function stc(){var n=new Date(),dy=D[n.getDay()],t=ds(),done=0,tot=0;dy.r.forEach(function(r,q){if(r[1]==='Study'){tot++;if(S.st[t+'|'+q])done++}});return[done,tot]}
function rTd(){var t=ds(),vi=Math.floor(new Date()/864e5)%VS.length,v=VS[vi],mo=['😊','🥰','😌','😐','😔','😤'],cm=S.m[t]||'',i,d,w='',sc=stc(),nx=null,nn='';
var mb=mo.map(function(e){return '<button class="btn'+(cm==e?'':' o')+'" onclick="setM(\''+e+'\')">'+e+'</button>'}).join('');
for(i=6;i>=0;i--){d=new Date();d.setDate(d.getDate()-i);w+='<b class="'+(S.m[ds(d)]?'y':'')+'">'+(S.m[ds(d)]||'·')+'</b>'}
[['jamb','JAMB'],['jupeb','JUPEB'],['putme','Post-UTME']].forEach(function(x){if(S.ex[x[0]]){var g=dif(t,S.ex[x[0]]);if(g>=0&&(nx===null||g<nx)){nx=g;nn=x[1]}}});
$('tcards').innerHTML='<div class="card verse"><h2>✨ Verse of the day</h2><p style="font-size:1.05rem">“'+v[1]+'”</p><b>'+v[0]+' (KJV)</b></div><div class="tiles"><div class="tile t1" onclick="go(1)"><b>'+(S.q[t]?S.q[t]+'m':'—')+'</b><small>🙏 Quiet time</small></div><div class="tile t2" onclick="go(3)"><b>'+sc[0]+'/'+sc[1]+'</b><small>📚 Study today</small></div><div class="tile t3" onclick="go(3)"><b>'+(nx===null?'Set':nx+'d')+'</b><small>⏳ '+(nn||'Next exam')+'</small></div></div><div class="card"><h2>💭 How do you feel today?</h2><div class="chips">'+mb+'</div><div class="dots">'+w+'</div></div>'}
function setM(e){if(S.m[ds()]==e)delete S.m[ds()];else S.m[ds()]=e;save();rTd()}
function hCd(){var t=ds(),cd=[['jamb','JAMB'],['jupeb','JUPEB'],['putme','Post-UTME']].map(function(x){var k=x[0];if(S.ex[k]){var g=dif(t,S.ex[k]);return '<div class="li"><div><b>'+x[1]+'</b><small>'+fmt(dd(S.ex[k]))+'</small></div><div class="chips"><span class="big" style="font-size:1.2rem">'+(g>0?g+' days':g==0?'Today 🙏':'Done ✓')+'</span><button class="btn o" onclick="clrEx(\''+k+'\')">✕</button></div></div>'}return '<div class="li"><b>'+x[1]+'</b><div class="chips"><input type="date" id="ex_'+k+'" style="width:auto;margin:0"><button class="btn s" onclick="setEx(\''+k+'\')">Set</button></div></div>'}).join('');return '<div class="card"><h2>⏳ Exam countdown</h2>'+cd+'</div>'}
function setEx(k){var v=$('ex_'+k).value;if(v){S.ex[k]=v;save();rSt()}}
function clrEx(k){delete S.ex[k];save();rSt()}
function hm(m){var a=Math.floor(m/60),b=m%60;return a+'h'+(b?' '+b+'m':'')}
function rSt(){var t=ds(),n=new Date(),dy=D[n.getDay()],tm=T(dy.r),h='',done=0,tot=0,w=0,wp=0,i,dow=(n.getDay()+6)%7;
dy.r.forEach(function(r,q){if(r[1]!=='Study')return;var k=t+'|'+q,on=S.st[k];tot++;if(on)done++;h+='<div class="li"><div><b>'+esc(lab(r))+'</b><small>'+r[0]+' · '+L[r[2].charAt(0)]+'</small></div><button class="btn'+(on?' s':' o')+'" onclick="tg(\''+k+'\')">'+(on?'✅ Done':'Mark done')+'</button></div>'});
for(i=0;i<7;i++){var d=new Date(n);d.setDate(n.getDate()-dow+i);var dr=D[d.getDay()],tt=T(dr.r),dk=ds(d);dr.r.forEach(function(r,q){if(r[1]!=='Study')return;var m=tt[q][1]-tt[q][0];wp+=m;if(S.st[dk+'|'+q])w+=m})}
var pc=wp?Math.round(w*100/wp):0;
$('v3').innerHTML='<div class="card"><h2>📚 Today’s study</h2>'+(tot?'<p class="mut">'+done+' of '+tot+' periods done</p>'+h:'<p class="mut">No study periods planned today. Rest well 🌸</p>')+'</div><div class="card"><h2>🌟 This week</h2><div class="big">'+hm(w)+' of '+hm(wp)+'</div><div class="bar"><i style="width:'+pc+'%"></i></div><p class="mut" style="text-align:center">'+pc+'% of your planned study</p></div>'+hCd()}
function tg(k){if(S.st[k])delete S.st[k];else S.st[k]=1;save();rSt()}
var YS=['💡 Ideas','🎥 Filming','✂️ Editing','✅ Posted'];
function rYt(){var h='',s;for(s=0;s<4;s++){var it=S.yt.map(function(x,i){return{x:x,i:i}}).filter(function(o){return o.x.s==s});h+='<div class="card"><h2>'+YS[s]+'</h2>'+(it.map(function(o){return '<div class="li"><b>'+esc(o.x.t)+'</b><div class="chips">'+(s<3?'<button class="btn g" onclick="adv('+o.i+')">▶</button>':'')+'<button class="btn o" onclick="delY('+o.i+')">✕</button></div></div>'}).join('')||'<small class="mut">Nothing here yet.</small>')+'</div>'}
$('v4').innerHTML='<div class="card"><h2>🎬 YouTube board</h2><input id="yt" placeholder="New video idea or task"><button class="btn s" onclick="addY()">Add idea</button><p class="mut">Tap ▶ to move it to the next step.</p></div>'+h}
function addY(){var v=$('yt').value.trim();if(v){S.yt.push({t:v,s:0});save();rYt()}}
function adv(i){S.yt[i].s++;save();rYt()}
function delY(i){S.yt.splice(i,1);save();rYt()}
go(0);show(cur);tick();setInterval(function(){tick();show(cur)},30000);
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){})}
</script>
</body>
